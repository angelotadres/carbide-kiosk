# Build-time settings. Sourced by build.sh, which merges these into the
# generated pi-gen config. Runtime settings belong in kiosk.conf on the boot
# partition, not here.

# pi-gen, pinned. The Carbide Motion package declares pre-t64 Qt5 dependency
# names, which exist on Bookworm armhf and not on Trixie.
PIGEN_REPO="https://github.com/RPi-Distro/pi-gen.git"
PIGEN_REF="2026-06-18-raspios-bookworm-armhf"

# Image identity.
IMG_NAME="carbide-kiosk"
TARGET_HOSTNAME="carbide-kiosk"
DEPLOY_COMPRESSION="xz"
LOCALE_DEFAULT="en_US.UTF-8"
KEYBOARD_LAYOUT="us"
TIMEZONE_DEFAULT="Etc/UTC"

# The kiosk account owns the X session and the CNC serial device. It has no
# password and no shell login; the image is administered by reflashing.
KIOSK_USER="kiosk"

# Carbide Motion acquisition. Leave CARBIDE_MOTION_BUILD empty to take the
# newest build from Carbide 3D's bucket; set it to a build number to pin.
CARBIDE_MOTION_BUILD=""
CARBIDE_MOTION_DEB_DIR="deb"

# Refuse first boot if the card leaves less than this for the Samba share.
DATA_PARTITION_MIN_MB="2048"
