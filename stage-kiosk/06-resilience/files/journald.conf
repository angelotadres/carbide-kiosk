[Journal]
# The status file is the only diagnostic interface, and it is filled in from
# here. A journal kept in RAM is erased by exactly the reboot you want to
# investigate, so it is persisted and capped instead. 64M of bounded, rate
# limited logging is negligible wear on the data partition.
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=8M
RateLimitIntervalSec=30s
RateLimitBurst=200
ForwardToSyslog=no
