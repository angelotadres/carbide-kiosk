# The power button is the only control this machine has. There is no keyboard,
# no network shell an operator can rely on, and Carbide Motion offers no way to
# shut down - so a short press is the single supported way to turn the machine
# off, and it has to work every time rather than by inheriting whatever
# systemd's defaults happen to be on a given release.
#
# Without this, the alternative is a five-second hold, which the Pi 5's PMIC
# services in hardware as an abrupt cut. That is precisely the event the
# read-only root exists to survive, not one to ask an operator to perform
# nightly.
#
# LongPress stays ignored deliberately. The firmware kills power at five
# seconds below the OS and systemd cannot intercept it, so claiming to handle
# it here would only describe something that does not happen.
[Login]
HandlePowerKey=poweroff
HandlePowerKeyLongPress=ignore

# A running X session must not be able to defer the shutdown. Nothing in this
# image takes an inhibitor lock today, but a future package that does would
# otherwise silently break the only off switch the machine has.
InhibitDelayMaxSec=5
