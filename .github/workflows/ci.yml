name: ci

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint every shell script
        # SC1091: sourced paths resolve on the image, not in the checkout.
        # SC2154: pi-gen supplies ROOTFS_DIR and friends to stage scripts.
        run: |
          mapfile -t scripts < <(
            find . -path ./pi-gen -prune -o -type f \
              \( -name '*.sh' -o -name '00-run.sh' -o -name 'carbide-*' \) -print \
              | grep -vE '\.service$|\.timer$|\.conf$|\.desktop$'
          )
          printf '%s\n' "${scripts[@]}"
          shellcheck -x -e SC1091,SC2154 "${scripts[@]}"

  unit:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run the unit suites
        run: >
          bats tests/select_build.bats tests/kiosk_conf.bats
          tests/status_redaction.bats tests/partition_start.bats
          tests/overlay_initramfs.bats tests/overlay_guard.bats
          tests/units.bats tests/access.bats

  render:
    name: generated configuration
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      # nft --check still talks to the kernel, so it needs the capability
      # even though it loads nothing.
      options: --cap-add=NET_ADMIN
    steps:
      - uses: actions/checkout@v4
      - name: Install the parsers that must accept our output
        run: |
          apt-get update
          apt-get install -y --no-install-recommends samba-common-bin nftables
      - name: Render and validate smb.conf and the nftables ruleset
        run: bash tests/render-config.sh

  dependencies:
    name: armhf dependency resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Fetch Carbide Motion
        run: ./scripts/fetch-carbide-motion.sh deb
      - name: Resolve the package list against Bookworm armhf
        # The Carbide Motion package declares pre-t64 Qt5 names. This job is
        # what catches the day a base-image change makes them unsatisfiable.
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/work" -w /work arm32v7/debian:bookworm \
            bash -c '
              set -e
              apt-get update
              # POSIX classes and two passes rather than one clever regex:
              # the previous pattern let comment words through as package
              # names, and pointed at a path that no longer existed, so this
              # check was passing while testing nothing at all.
              packages=$(grep -v "^[[:space:]]*#" stage-kiosk/00-base/00-packages \
                          | grep -v "^[[:space:]]*$")
              test -n "$packages"
              # shellcheck disable=SC2086
              apt-get install --simulate --no-install-recommends $packages
              apt-get install --simulate ./deb/carbidemotion-*.deb
              # The package under-declares its dependencies: the binary links
              # against libQt5PrintSupport, which Depends does not mention.
              # Install for real and ask the linker, rather than trusting it.
              # shellcheck disable=SC2086
              apt-get install -y --no-install-recommends $packages
              apt-get install -y ./deb/carbidemotion-*.deb
              missing=$(ldd /usr/local/bin/carbidemotion | grep "not found" || true)
              if [ -n "$missing" ]; then
                echo "carbidemotion has unresolved libraries:"; echo "$missing"; exit 1
              fi
              echo "all libraries resolve"
            '

  staging:
    name: clean-clone staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A clean clone has no empty directories, which is exactly how the
      # first tagged build broke. This runs everything up to pi-gen itself,
      # in about a minute rather than after ten.
      - name: Stage without building
        run: CARBIDE_STAGE_ONLY=1 ./build.sh
      - name: Confirm the stage is complete
        run: |
          test -f pi-gen/stage-kiosk/01-carbide-motion/files/carbidemotion.deb
          test -f pi-gen/stage-kiosk/07-firstboot/files/kiosk.conf.example
          test -f pi-gen/config
          test -f pi-gen/stage3/SKIP
          grep -q "STAGE_LIST='stage0 stage1 stage2 stage-kiosk'" pi-gen/config
      - name: Confirm the package list contains only package names
        run: |
          # A text edit once split comment lines and left prose in the middle
          # of the list. The dependency job then tried to install words like
          # "rather" and "than", which is a confusing way to find out.
          bad=$(grep -v '^[[:space:]]*#' stage-kiosk/00-base/00-packages \
                | grep -v '^[[:space:]]*$' \
                | grep -vE '^[a-z0-9][a-z0-9.+-]*$' || true)
          if [ -n "$bad" ]; then
            echo "not package names:"; echo "$bad"; exit 1
          fi
          echo "package list is clean"
      - name: Confirm kiosk.conf documents exactly what the code reads
        run: |
          # Every setting the machine reads must be in the template an
          # operator edits, and the template must not advertise settings
          # nothing honours. Both directions silently mislead.
          grep -rhoE 'kiosk_get [a-z_]+|kiosk_enabled [a-z_]+' stage-kiosk/ \
            | awk '{print $2}' | sort -u > /tmp/used.txt
          grep -oE '^[a-z_]+=' config/kiosk.conf.example | tr -d '=' | sort -u > /tmp/doc.txt
          undocumented=$(comm -23 /tmp/used.txt /tmp/doc.txt)
          unread=$(comm -13 /tmp/used.txt /tmp/doc.txt)
          if [ -n "$undocumented" ]; then echo "read but undocumented:"; echo "$undocumented"; fi
          if [ -n "$unread" ]; then echo "documented but never read:"; echo "$unread"; fi
          [ -z "$undocumented" ] && [ -z "$unread" ]
      - name: Confirm the stage matches pi-gen's contract
        run: |
          # pi-gen only reads *-packages inside a sub-stage directory. A file
          # at the stage root is silently ignored, and the packages never
          # get installed.
          ! ls stage-kiosk/*-packages 2>/dev/null
          test -f stage-kiosk/00-base/00-packages
          # on_chroot mounts a tmpfs over the rootfs /tmp, so anything staged
          # there before the call disappears.
          ! grep -rn 'ROOTFS_DIR}/tmp' stage-kiosk/
      - name: Confirm no known credential ships in the image
        run: |
          # pi-gen requires a first-user password for a headless build; it
          # must be generated, not fixed, and the stage must lock the account.
          pass=$(sed -n "s/^FIRST_USER_PASS='\(.*\)'$/\1/p" pi-gen/config)
          test "${#pass}" -ge 32
          grep -qE "usermod -p '[*]' kiosk" stage-kiosk/02-kiosk-session/00-run.sh
          # A second run must not produce the same password.
          mv pi-gen/config pi-gen/config.first
          CARBIDE_STAGE_ONLY=1 ./build.sh >/dev/null
          ! cmp -s pi-gen/config pi-gen/config.first

  image:
    name: build image
    needs: [lint, unit, render, dependencies, staging]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk for the build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Install the armhf emulation pi-gen needs
        # pi-gen's build-docker.sh checks for qemu-arm-static on PATH and a
        # mounted binfmt_misc before it will cross-build an armhf rootfs.
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          qemu-arm-static --version | head -1
          test -f /proc/sys/fs/binfmt_misc/register
      - name: Build
        run: ./build.sh
      - name: Checksum
        run: cd deploy && sha256sum ./* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: carbide-kiosk-image
          path: deploy/
          retention-days: 14
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A tag carrying a hyphen is a pre-release by semver, so alpha and
        # beta builds never present themselves as the latest stable image.
        run: |
          flags=()
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" deploy/* \
            --title "$TAG" \
            --generate-notes \
            "${flags[@]}"
