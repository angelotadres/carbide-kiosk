name: ci

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint every shell script
        # SC1091: sourced paths resolve on the image, not in the checkout.
        # SC2154: pi-gen supplies ROOTFS_DIR and friends to stage scripts.
        run: |
          mapfile -t scripts < <(
            find . -path ./pi-gen -prune -o -type f \
              \( -name '*.sh' -o -name '00-run.sh' -o -name 'carbide-*' \) -print \
              | grep -vE '\.service$|\.conf$'
          )
          printf '%s\n' "${scripts[@]}"
          shellcheck -x -e SC1091,SC2154 "${scripts[@]}"

  unit:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run the unit suites
        run: bats tests/select_build.bats tests/kiosk_conf.bats

  render:
    name: generated configuration
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      # nft --check still talks to the kernel, so it needs the capability
      # even though it loads nothing.
      options: --cap-add=NET_ADMIN
    steps:
      - uses: actions/checkout@v4
      - name: Install the parsers that must accept our output
        run: |
          apt-get update
          apt-get install -y --no-install-recommends samba-common-bin nftables
      - name: Render and validate smb.conf and the nftables ruleset
        run: bash tests/render-config.sh

  dependencies:
    name: armhf dependency resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Fetch Carbide Motion
        run: ./scripts/fetch-carbide-motion.sh deb
      - name: Resolve the package list against Bookworm armhf
        # The Carbide Motion package declares pre-t64 Qt5 names. This job is
        # what catches the day a base-image change makes them unsatisfiable.
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/work" -w /work arm32v7/debian:bookworm \
            bash -c '
              set -e
              apt-get update
              grep -vE "^\s*(#|$)" stage-kiosk/00-packages | xargs \
                apt-get install --simulate --no-install-recommends
              apt-get install --simulate ./deb/carbidemotion-*.deb
            '

  staging:
    name: clean-clone staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A clean clone has no empty directories, which is exactly how the
      # first tagged build broke. This runs everything up to pi-gen itself,
      # in about a minute rather than after ten.
      - name: Stage without building
        run: CARBIDE_STAGE_ONLY=1 ./build.sh
      - name: Confirm the stage is complete
        run: |
          test -f pi-gen/stage-kiosk/01-carbide-motion/files/carbidemotion.deb
          test -f pi-gen/stage-kiosk/07-firstboot/files/kiosk.conf.example
          test -f pi-gen/config
          test -f pi-gen/stage3/SKIP
          grep -q "STAGE_LIST='stage0 stage1 stage2 stage-kiosk'" pi-gen/config

  image:
    name: build image
    needs: [lint, unit, render, dependencies, staging]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk for the build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Install the armhf emulation pi-gen needs
        # pi-gen's build-docker.sh checks for qemu-arm-static on PATH and a
        # mounted binfmt_misc before it will cross-build an armhf rootfs.
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          qemu-arm-static --version | head -1
          test -f /proc/sys/fs/binfmt_misc/register
      - name: Build
        run: ./build.sh
      - name: Checksum
        run: cd deploy && sha256sum ./* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: carbide-kiosk-image
          path: deploy/
          retention-days: 14
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A tag carrying a hyphen is a pre-release by semver, so alpha and
        # beta builds never present themselves as the latest stable image.
        run: |
          flags=()
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" deploy/* \
            --title "$TAG" \
            --generate-notes \
            "${flags[@]}"
